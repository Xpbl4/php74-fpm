name: Docker image

# Pull requests build both images; master publishes them to Docker Hub.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: xpbl4/php74-fpm

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfiles
        run: docker run --rm -v "$PWD:/src" -w /src hadolint/hadolint:latest-debian hadolint Dockerfile Dockerfile.alpine

  image:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu image as before: amd64 only.
          - variant: ubuntu
            dockerfile: Dockerfile
            platforms: linux/amd64
            tag: latest
          - variant: alpine
            dockerfile: Dockerfile.alpine
            platforms: linux/amd64,linux/arm64
            tag: alpine
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=sha,prefix=${{ matrix.variant }}-
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          # The image namespace is the Docker Hub user unless DOCKERHUB_USERNAME says otherwise.
          username: ${{ secrets.DOCKERHUB_USERNAME || 'xpbl4' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
